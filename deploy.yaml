import:
  - recipe/laravel.php

config:
  repository: 'git@github.com:jevouslue/udemy-laravel-for-release-app.git'
  keep_releases: 2

hosts:
  production:
    hostname: udemy-laravel-for-release.katalyst.jp
    remote_user: limebat15
    deploy_path: ~/www/udemy-laravel-for-release.katalyst.jp
  staging:
    hostname: staging.udemy-laravel-for-release.katalyst.jp
    remote_user: limebat15
    deploy_path: ~/www/staging.udemy-laravel-for-release.katalyst.jp

tasks:
  build:
    - run: uptime
  upload_env:
    - desc: 環境に応じた.envの転送
    - run: mkdir -p {{deploy_path}}/shared
    - upload:
        src: '.env.{{alias}}'
        dest: '{{deploy_path}}/shared/.env'
  deploy:env:
    - desc: 環境に応じた.envの複合化
    - run: '{{bin/php}} {{bin/artisan}} env:decrypt --env={{alias}}'

after:
  deploy:failed: deploy:unlock
